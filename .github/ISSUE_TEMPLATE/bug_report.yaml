name: Bug Report
description: Create a report to help us address issues you are facing with the app.
title: "[BUG] Your bug report title here"
labels: [ bug ]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this issue! Here are a few things to check before clicking the submit button :)
        1. Make sure you're on the latest version of the app. The current release can be found here: https://github.com/Mahmud0808/PixelLauncherEnhanced/releases/latest
        2. Search through **both** [open and closed issues](https://github.com/Mahmud0808/PixelLauncherEnhanced/issues?q=is%3Aissue%20sort%3Aupdated-desc) for your bug.
        3. **ALWAYS** fill this template. If you fail to do so, your issue will be immediately closed with no response. Maintaining open source projects for free is hard work, and we expect users to respect that time and effort by putting in a little bit of their own. That helps us fix these problems faster and in return you get a better app — everybody wins.

        Note: If this issue is inactive for 90 days, it'll be marked as stale.

  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the bug
      value: |
        Steps to reproduce the behavior:
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots to help explain your problem.
    validations:
      required: false

  - type: textarea
    id: debug-report
    attributes:
      label: Debug report
      description: In the app, go to Advanced → Debug report, tap Create report and attach the zip here.
      placeholder: Drop the debug report zip here. If GitHub won't take it, upload it somewhere and paste the link.
    validations:
      required: true
